plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.jarvis.robotai"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    defaultConfig {
        applicationId = "com.jarvis.robotai"
        minSdk = 26
        targetSdk = 34
        // versionCode & versionName diambil otomatis dari pubspec.yaml oleh Flutter.
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "jarvis-release.p12")
            storePassword System.getenv("ANDROID_STORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "jarvis"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        release {
            // Di CI (secrets tersedia): pakai kunci rilis permanen.
            // Lokal: fallback ke debug.
            signingConfig = System.getenv("ANDROID_STORE_PASSWORD") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Decode icon robot dari base64 (teks) jadi PNG tiap build.
// Solusi: GitHub API tidak bisa push binary dengan benar,
// jadi icon disimpan sebagai teks base64 di robot-icon.b64.
task decodeRobotIcon {
    doLast {
        def b64file = file("../../robot-icon.b64")
        if (!b64file.exists()) {
            println("robot-icon.b64 tidak ada, pakai icon bawaan.")
            return
        }
        def bytes = java.util.Base64.getDecoder().decode(b64file.text.trim())
        def densities = ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi",
                         "mipmap-xxhdpi", "mipmap-xxxhdpi"]
        densities.each { d ->
            def out = file("src/main/res/${d}/ic_launcher.png")
            out.bytes = bytes
            println("Icon ditulis: ${d}")
        }
    }
}
preBuild.dependsOn decodeRobotIcon

flutter { source = "../.." }
