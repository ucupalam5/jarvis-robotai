# Codemagic build — alternatif saat GitHub Actions dikunci akun.
# Cara pakai dari HP: codemagic.io > login via GitHub > Add app > pilih repo ini
# > build otomatis pakai file ini > download app-release.apk
workflows:
  android-release:
    name: Jarvis Android Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      # Dikunci 3.24.5 agar cocok dengan AGP 8.1.0 + Kotlin 1.9.10 + flutter_tts 4.0.2.
      # Stable terbaru gagal compile (sama seperti di GitHub Actions).
      flutter: 3.24.5
      java: 17
      vars:
        PACKAGE_NAME: "com.jarvis.robotai"
    scripts:
      - name: Siapkan .env
        script: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
