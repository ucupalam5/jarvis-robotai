name: Build Jarvis APK

# Build APK Flutter TANPA PC — cukup push dari HP via browser GitHub.
# Hasil: Actions > Artifacts > jarvis-app-release > app-release.apk (siap install)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Dikunci 3.24.5 agar cocok dengan AGP 8.1.0 + Kotlin 1.9.10.
          # Stable terbaru (3.4x) gagal compile FlutterPlugin.kt di runner.
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze (warning tidak menggagalkan build)
        run: flutter analyze || true

      - name: Build APK release
        run: flutter build apk --release -v

      - name: Cek hasil APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
