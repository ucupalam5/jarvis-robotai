name: jarvis_robotai
description: Asisten RobotAI pribadi ala Jarvis - voice control Android + Groq AI.
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  speech_to_text: ^6.6.0
  # Dikunci 4.0.2: versi 4.2.x butuh Kotlin 2.x dan gagal compile dengan Kotlin 1.9.10.
  flutter_tts: 4.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
