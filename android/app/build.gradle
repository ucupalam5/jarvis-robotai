plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.jarvis.robotai"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    defaultConfig {
        applicationId = "com.jarvis.robotai"
        minSdk = 26
        targetSdk = 34
        // versionCode & versionName diambil otomatis dari pubspec.yaml oleh Flutter.
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "jarvis-release.p12")
            storePassword System.getenv("ANDROID_STORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "jarvis"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        release {
            // Di CI (secrets tersedia): pakai kunci rilis permanen.
            // Lokal: fallback ke debug.
            signingConfig = System.getenv("ANDROID_STORE_PASSWORD") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter { source = "../.." }
